<!DOCTYPE html>
<html lang="{{ .Params.lang | default "ca" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            max-width: 1100px;
            margin: 0 auto;
            padding: 1em;
            overflow-wrap: break-word;
        }
        div.banner a:visited, div.banner a:link {
            text-decoration: none;
            color: black;
        }
        .brutal-grid {
            display: grid;
            grid-auto-flow: row;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 2em;
        }
        .category li {
            padding-bottom: 0.5rem;
        }
        #search {
            width: 100%;
            max-width: 30em;
            font-size: 1.1em;
            padding: 0.4em;
            margin: 1em 0;
            border: 2px solid black;
            font-family: inherit;
        }
        .recipe-page {
            max-width: 70ch;
        }
        .recipe-body {
            line-height: 1.5;
        }
        .generated {
            color: #595959;
            font-size: 0.85em;
        }
        hr {
            border: none;
            border-top: 2px solid black;
            margin: 2em 0;
        }

        @media (max-width: 800px) {
            .brutal-grid {
                display: grid;
                grid-auto-flow: row;
                grid-template-columns: repeat(1, 1fr);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.75em;
            }
            h1 {
                font-size: 1.6em;
            }
            #search {
                font-size: 1em;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
                color: #e8e6e3;
            }
            div.banner a:visited, div.banner a:link {
                text-decoration: none;
                color: white;
            }
            a:link {
                color: #3391ff;
            }
            a:visited {
                color: #ba55d3;
            }
            #search {
                background-color: #000;
                color: #e8e6e3;
                border-color: #e8e6e3;
            }
            hr {
                border-top-color: #e8e6e3;
            }
            .generated {
                color: #9a9a9a;
            }
        }
    </style>
</head>
<body>
    {{ if .IsHome }}
    <header>
        <div class="banner"><h1><a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a></h1></div>
        <aside class="generated">Generat {{ partial "catalan-date.html" now }} a les {{ now.Format "15:04" }}</aside>
    </header>
    {{ end }}
    {{ block "main" . }}{{ end }}
</body>
</html>
